<!DOCTYPE html>
<html lang="en-GB">
	<head>
		<title>Archive Listing</title>
		<link rel="shortcut icon" href="/cdn/static/assets/sniper.jpg" type="image/x-icon">
		<meta charset="UTF-8">
	</head>

	<style type="text/css">
		*{
			color: #E2E2E2;
			font-family: monospace;
		}
		html{
			background: #19191C;
		}
	</style>

	<style>
		.tree_item{
			display: flex;
			flex-direction: row;
		}

		.tree_item:not(:first-child){
			/*margin-top: 4px;*/
		}

		img{
			width: 20px;
			height: 20px;
			object-fit: contain;
			object-position: center;
			opacity: 0.5;
		}

		details{
			display: flex;
			flex-direction: column !important;
			padding-left: 30px;
			position: relative;
			margin-top: 5px;
		}

		details::before{
			content: '';
			position: absolute;
			left: 25px;
			bottom: 0px;
			height: 100%;
			width: 1px;
			background: rgb(90, 90, 90);
		}

		details:hover::before{
			background: rgb(110, 110, 150);
		}

		details:hover > summary > .item_name{
			color: #BAD1FF;
		}

		summary{
			user-select: none;
			font-weight: bold;
		}

		summary, .tfile{
			padding: 2px 0px 2px 0px;
		}

		summary:hover, .tfile:hover{
			background: rgba(255, 255, 255, 0.1);
		}

		.tfile{
			margin-left: 30px;
		}

		.item_name, .item_size{
			display: flex;
			flex-direction: row;
			align-items: center;
		}

		.item_size{
			margin-left: 10px;
			user-select: none;
			opacity: 0.5;
		}

		.item_name{
			margin-left: 7px;
		}
	</style>

	<body>
		%archive_xml%
	</body>

	<script type="text/javascript">
		for (const fileDOM of document.querySelectorAll('a[abspath]')){
			fileDOM.href = window.location.pathname + '?arc_ext=' + fileDOM.getAttribute('abspath');
		}
	</script>

</html>
